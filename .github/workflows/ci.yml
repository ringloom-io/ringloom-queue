# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0
  JAVA_VERSION: "25"
  GRADLE_VERSION: current
  RELEASE_TARGET: x86_64-linux-gnu.2.28

jobs:
  build:
    name: Build and test
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Run Zig tests
        run: zig build test --summary all

      - name: Build C ABI shared library
        run: zig build c-abi -Doptimize=ReleaseSmall

      - name: Run Java binding tests
        run: gradle --no-daemon -p bindings/java test

      - name: Build Java binding jar and Javadocs
        run: gradle --no-daemon -p bindings/java jar javadoc

  release:
    name: Release tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Derive release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "Could not derive version from tag '${GITHUB_REF_NAME}'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run Zig tests
        run: zig build test --summary all

      - name: Build Linux x86_64 shared library
        run: zig build c-abi -Dtarget=${{ env.RELEASE_TARGET }} -Doptimize=ReleaseSmall

      - name: Package Linux x86_64 shared library
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          package="ringloom-queue-${version}-linux-x86_64"
          mkdir -p "dist/${package}/lib"
          cp zig-out/lib/libringloom_queue.so "dist/${package}/lib/libringloom_queue.so"
          cp LICENSE "dist/${package}/LICENSE"
          cp README.md "dist/${package}/README.md"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"
          sha256sum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Run Java binding tests
        run: >
          gradle --no-daemon -p bindings/java test
          -PringloomQueue.embeddedNativeLibDir=${{ github.workspace }}/zig-out/lib

      - name: Build Java binding jar
        run: >
          gradle --no-daemon -p bindings/java jar
          -PringloomQueue.version=${{ steps.version.outputs.version }}
          -PringloomQueue.embeddedNativeLibDir=${{ github.workspace }}/zig-out/lib

      - name: Stage Java binding jar
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          cp "bindings/java/build/libs/ringloom-queue-java-bindings-${version}.jar" \
            "dist/ringloom-queue-java-bindings-${version}-linux-x86_64.jar"
          sha256sum "dist/ringloom-queue-java-bindings-${version}-linux-x86_64.jar" \
            > "dist/ringloom-queue-java-bindings-${version}-linux-x86_64.jar.sha256"

      - name: Upload shared library artifact
        uses: actions/upload-artifact@v4
        with:
          name: ringloom-queue-${{ steps.version.outputs.version }}-linux-x86_64
          path: |
            dist/ringloom-queue-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            dist/ringloom-queue-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

      - name: Upload Java binding artifact
        uses: actions/upload-artifact@v4
        with:
          name: ringloom-queue-java-bindings-${{ steps.version.outputs.version }}-linux-x86_64
          path: |
            dist/ringloom-queue-java-bindings-${{ steps.version.outputs.version }}-linux-x86_64.jar
            dist/ringloom-queue-java-bindings-${{ steps.version.outputs.version }}-linux-x86_64.jar.sha256
          if-no-files-found: error

      - name: Publish Java bindings to Maven Central
        working-directory: bindings/java
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: >
          gradle --no-daemon publishToMavenCentral
          -PringloomQueue.version=${{ steps.version.outputs.version }}
          -PringloomQueue.mavenGroup=io.ringloom
          -PringloomQueue.embeddedNativeLibDir=${{ github.workspace }}/zig-out/lib

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ringloom-queue-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            dist/ringloom-queue-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
            dist/ringloom-queue-java-bindings-${{ steps.version.outputs.version }}-linux-x86_64.jar
            dist/ringloom-queue-java-bindings-${{ steps.version.outputs.version }}-linux-x86_64.jar.sha256
